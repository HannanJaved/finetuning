# Alpha: 2 nodes x 8 GPUs x per-device batch 1 x grad accum 8 = 128.
# Random half of Dolci-Instruct-DPO. get_dataset shuffles with this seed and
# keeps the first 50%, so 4B and 8B train on the same rows. seed 8 and
# warmup_ratio 0.1 match the full-data runs.
model_name_or_path: /data/horse/ws/hama901h-BFTranslation/checkpoints/Qwen/Qwen3-8B-Base/SFT-sweep/Qwen3-8B-SFT-LR3e-5/Assistant-Only
torch_dtype: bfloat16
use_liger_kernel: false
attn_implementation: flash_attention_2
dataset_mixture:
  datasets:
    - id: allenai/Dolci-Instruct-DPO
      split: train
      weight: 0.5
  seed: 8
bf16: true
beta: 0.01
do_eval: false
gradient_checkpointing_kwargs:
  use_reentrant: False
learning_rate: 4e-7
log_level: info
logging_steps: 10
lr_scheduler_type: linear
max_length: 4096
max_prompt_length: 512
num_train_epochs: 1
optim: adamw_torch
output_dir: /data/horse/ws/hama901h-BFTranslation/checkpoints/Qwen/Qwen3-8B-Base/SFT-sweep/Qwen3-8B-SFT-LR3e-5/Assistant-Only/olmo3-dpo/DPO-HalfDolci-LR4e-7_Beta0.01-Qwen3-8B-SFT-LR3e-5-AO/
overwrite_output_dir: true
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
save_strategy: "steps"
save_steps: 200
save_total_limit: 20
seed: 8
warmup_ratio: 0.1
length_normalize_logps: false
